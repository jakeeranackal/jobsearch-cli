# jobsearch-cli configuration
# Easiest: run `jobsearch setup` and it writes this for you.
# Or copy this file to config.yaml and edit. config.yaml is gitignored so your
# personal info stays out of the repo.

user:
  name: Your Name
  email: you@example.com
  phone: "555-555-5555"
  location: City, ST
  linkedin: https://linkedin.com/in/yourhandle
  github: https://github.com/yourhandle
  timezone: America/New_York

# Resume tracks let you maintain multiple versions of your resume — e.g. one
# focused on operations roles and one on data/analytics roles. The matcher
# scores every job against every track and picks the best fit per job.
resume_tracks:
  ops:
    path: resumes/ops_resume.txt        # .txt, .docx or .pdf
    # Optional: a longer resume with every bullet you've ever written.
    # `prepare` and `check` use this instead of `path`.
    # master: resumes/master_resume.docx
    # Keywords get an extra weight on top of TF-IDF similarity.
    keywords:
      - client services
      - hospitality
      - vip
      - events
      - operations
      - coordination
  data:
    path: resumes/data_resume.txt
    keywords:
      - python
      - sql
      - pandas
      - scikit-learn
      - analytics
      - regression
      - sports analytics

# What you're targeting. roles also feed Workday searches.
search:
  roles: [data analyst, business analyst]
  salary_floor: 60000        # `list` hides jobs whose posted max is below this
  weekly_target: 10          # applications per week, used by `report`

# Optional hard filters — jobs that don't match these are dropped at discover time.
filters:
  # Drop jobs with these substrings in the title (case-insensitive)
  # Only keep titles containing one of these (empty = keep all)
  include_title_terms: []
  exclude_title_terms:
    - senior
    - principal
    - staff
    - director
    - vp
    - "head of"
  # Only keep jobs in these locations (substring match, case-insensitive).
  # Leave empty to keep all locations.
  include_locations:
    - philadelphia
    - philly
    - remote
    - new york
    - nyc

# Job sources — one section per ATS. The slugs are usually the same as the
# subdomain on the company's careers page.
#
#   Greenhouse: https://boards.greenhouse.io/SLUG  -> use SLUG
#   Lever:      https://jobs.lever.co/SLUG         -> use SLUG
#   Ashby:      https://jobs.ashbyhq.com/SLUG      -> use SLUG
#   Workable:   https://apply.workable.com/SLUG    -> use SLUG
#   SmartRecruiters: https://jobs.smartrecruiters.com/SLUG -> use SLUG
#   Workday:    https://HOST.myworkdayjobs.com/SITE -> use HOST/SITE
# Or skip all that: `jobsearch companies add <careers url>` figures it out.
sources:
  greenhouse: []
    # - airbnb
    # - notion
  lever: []
    # - netflix
  ashby: []
    # - openai
  workable: []
  smartrecruiters: []
  workday: []
    # - nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
  rss:
    []
    # - name: Example Company Careers
    #   url: https://example.com/careers/feed.xml

# Follow-up cadence in days. "applied" means how long after applying you should
# follow up if you haven't heard back, etc.
followup_days:
  applied: 7
  interviewing: 5
  drafted: 3

# Where per-job folders go (default ./applications)
# applications_dir: ../applications

# Extra terms for keyword analysis beyond the built-in skill list.
keywords:
  extra: []

tailor:
  max_bullets_per_role: 5

# Daily digest and alerts
digest:
  min_score: 0.2
  max_items: 10
  weekly_report_day: monday
alerts:
  min_score: 0.35       # hourly alerts only ping above this

# Where the digest goes: none | telegram | gmail | smtp
notify:
  channel: none
  email_to: you@example.com
  # smtp: {host: smtp.gmail.com, port: 587, user: you@gmail.com, password_env: JOBSEARCH_SMTP_PASSWORD}

telegram:
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id: ""

