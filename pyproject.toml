[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch-cli"
version = "0.1.0"
description = "Run a focused, defensible job search from the command line."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jake" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
jobsearch = "jobsearch.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobsearch = ["templates/*.j2"]
