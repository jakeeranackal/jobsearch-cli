stories:
  - title: Automated a weekly reconciliation
    tags: [python, automation, process improvement, sql]
    situation: Finance spent most of Monday reconciling enrollment numbers by hand.
    task: I was asked to cut the error rate and the time it took.
    action: I wrote a Python script that pulled the data with SQL, matched records, and flagged mismatches for review.
    result: Saved about 6 hours a week and mismatches dropped to near zero.

  - title: Handled an upset client before a big event
    tags: [client services, stakeholder management, communication, events]
    situation: A VIP client was unhappy about a venue change two days before their event.
    task: Keep the client and save the event.
    action: I called them that day, walked through options, and coordinated with vendors on a fix.
    result: The event went ahead, and the client rebooked with us the next quarter.
